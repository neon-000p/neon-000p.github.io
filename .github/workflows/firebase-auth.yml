name: Firebase のログイン用ファイルを取り込む

# AkariEN のログインの受け渡しに使うファイルを、Firebase から取り寄せて __/auth/ に置く。
# __/firebase/init.json は Firebase Hosting を使っていないので向こうに無い。手で置いてある（値は公開されてよいもの）。
# Firebase 側が更新されても追いつけるよう、週1回も確かめる（変わっていなければコミットしない）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-auth.yml'
  schedule:
    - cron: '0 18 * * 0'   # JST 月曜 3:00

permissions:
  contents: write

concurrency:
  group: firebase-auth

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 取り寄せる
        run: |
          set -u
          mkdir -p __/auth
          # 拡張子の無い handler と iframe は .html を付けて置く（GitHub Pages が HTML として返すように）
          fetch() {   # $1=Firebase 側の場所  $2=置き先。firebaseapp.com、だめなら web.app から
            for host in toeic-daily-7cea5.firebaseapp.com toeic-daily-7cea5.web.app; do
              code=$(curl -sSL -o "$2" -w '%{http_code}' "https://$host/$1")
              echo "$code  https://$host/$1"
              [ "$code" = 200 ] && return 0
            done
            rm -f "$2"; return 1
          }
          ng=0
          fetch __/auth/handler        __/auth/handler.html    || ng=1
          fetch __/auth/iframe         __/auth/iframe.html     || ng=1
          fetch __/auth/handler.js     __/auth/handler.js      || ng=1
          fetch __/auth/experiments.js __/auth/experiments.js  || ng=1
          fetch __/auth/iframe.js      __/auth/iframe.js       || ng=1
          ls -la __/auth __/firebase
          exit $ng

      - name: 変わっていればコミット
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add __
          if git diff --cached --quiet; then
            echo "変更なし"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Firebase のログイン用ファイルを更新"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # 公開後に、ページとして返っているかを確かめる（Pages の反映を待つ）
      - name: 公開された中身を確かめる
        run: |
          sleep 90
          for p in __/auth/handler __/auth/iframe __/auth/handler.js __/firebase/init.json; do
            printf '%-24s ' "$p"
            curl -s -o /dev/null -w '%{http_code} %{content_type}\n' "https://neon-000p.github.io/$p"
          done
