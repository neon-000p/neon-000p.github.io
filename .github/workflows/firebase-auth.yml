name: Firebase のログイン用ファイルを取り込む

# AkariEN のログインの受け渡しに使うファイルを、Firebase から取り寄せて __/auth/ に置く。
# Firebase 側が更新されても追いつけるよう、週1回も確かめる（変わっていなければコミットしない）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/firebase-auth.yml'
  schedule:
    - cron: '0 18 * * 0'   # JST 月曜 3:00

permissions:
  contents: write

concurrency:
  group: firebase-auth

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 取り寄せる
        run: |
          set -eu
          base=https://toeic-daily-7cea5.firebaseapp.com
          mkdir -p __/auth __/firebase
          # 拡張子の無い2つは .html を付けて置く（GitHub Pages が HTML として返すように）
          curl -fsSL "$base/__/auth/handler"        -o __/auth/handler.html
          curl -fsSL "$base/__/auth/iframe"         -o __/auth/iframe.html
          curl -fsSL "$base/__/auth/handler.js"     -o __/auth/handler.js
          curl -fsSL "$base/__/auth/experiments.js" -o __/auth/experiments.js
          curl -fsSL "$base/__/auth/iframe.js"      -o __/auth/iframe.js
          curl -fsSL "$base/__/firebase/init.json"  -o __/firebase/init.json
          ls -la __/auth __/firebase

      - name: 変わっていればコミット
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add __
          if git diff --cached --quiet; then
            echo "変更なし"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Firebase のログイン用ファイルを更新"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # 公開後に、ページとして返っているかを確かめる（Pages の反映を待つ）
      - name: 公開された中身を確かめる
        run: |
          sleep 90
          for p in __/auth/handler __/auth/iframe __/auth/handler.js __/firebase/init.json; do
            printf '%-24s ' "$p"
            curl -s -o /dev/null -w '%{http_code} %{content_type}\n' "https://neon-000p.github.io/$p"
          done
